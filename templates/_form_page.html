{% extends "base.html" %}{% load i18n %}
{% block title %}{{ page_title }}{% endblock %}
{% block content %}
<div class="card narrow">
  <h1>{{ page_title }}</h1>
  {% block before_form %}{% endblock %}
  <form method="post" class="form"{% if multipart %} enctype="multipart/form-data"{% endif %}>{% csrf_token %}
    {{ form.as_div }}
    <button>{{ submit_label|default:_("Save") }}</button>
  </form>
  {% block after_form %}{% endblock %}
</div>
{% endblock %}
